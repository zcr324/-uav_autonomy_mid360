# LTA-OM FAST_LIO frontend config for simulated Livox Mid360 (single iris_0).
# 数值移植自 slam_ws 已验证的 FAST_LIO/config/my_mid360.yaml（外参与 SDF 安装一致）。

common:
    lid_topic:  "/iris_0/scan"
    imu_topic:  "/iris_0/imu_gazebo"

preprocess:
    lidar_type: 1                # Livox LiDAR
    scan_line: 6
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 20.0
    extrinsic_T: [-0.005, 0.005, -0.153]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]
