# Driver2 simulated MID-360; LiDAR and IMU occupy the same sensor pose.
common:
  lid_topic: /livox/lidar
  imu_topic: /livox/imu
preprocess:
  lidar_type: 1
  scan_line: 4
  blind: 0.5
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360
  det_range: 20.0
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
